<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="บันทึกร่างกาย">
<title>บันทึกน้ำหนัก & รอบเอว</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1c1e21;--mu:#6b7280;--bd:#e3e5e8;--a:#2f6fed;--b:#e8742a}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1c1e22;--tx:#eceef1;--mu:#9aa0a8;--bd:#2c2f35;--a:#6b9bff;--b:#f08e4e}}
:root[data-theme="dark"]{--bg:#111214;--card:#1c1e22;--tx:#eceef1;--mu:#9aa0a8;--bd:#2c2f35;--a:#6b9bff;--b:#f08e4e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Sarabun","Noto Sans Thai",sans-serif;font-size:16px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input{width:100%;font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:10px;margin-bottom:10px}.row>div{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:12px;cursor:pointer}
.pri{width:100%;background:var(--a);color:#fff;font-weight:600}
.sm{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:8px 12px;font-size:14px}
.item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item small{color:var(--mu)}
.del{background:none;color:var(--mu);font-size:20px;padding:4px 10px}
h2{font-size:15px;margin:0 0 8px}
.leg{font-size:13px;color:var(--mu);margin-bottom:4px}
svg{width:100%;height:auto;display:block}
.empty{color:var(--mu);text-align:center;padding:12px}
.bk{display:flex;gap:8px}
</style>
</head>
<body>
<main>
<h1>⚖️ บันทึกน้ำหนัก & รอบเอว</h1>

<div class="card">
<div class="row"><div><label>วัน/เดือน/ปี</label><input type="date" id="d"></div></div>
<div class="row">
<div><label>น้ำหนัก (กก.)</label><input type="number" id="w" inputmode="decimal" step="0.1" placeholder="0.0"></div>
<div><label>รอบเอว (ซม.)</label><input type="number" id="c" inputmode="decimal" step="0.1" placeholder="0.0"></div>
</div>
<button class="pri" id="save">บันทึก</button>
</div>

<div class="card"><h2>แนวโน้ม</h2>
<div class="leg" style="color:var(--a)">● น้ำหนัก (กก.)</div><div id="c1"></div>
<div class="leg" style="color:var(--b);margin-top:10px">● รอบเอว (ซม.)</div><div id="c2"></div>
</div>

<div class="card"><h2>ประวัติ</h2><div id="list"></div></div>

<div class="card"><h2>สำรองข้อมูล</h2>
<div class="bk"><button class="sm" id="exp">คัดลอกข้อมูล</button><button class="sm" id="imp">นำเข้าข้อมูล</button></div>
<div class="leg" style="margin-top:8px">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ ควรคัดลอกเก็บไว้เป็นระยะ</div>
</div>
</main>
<script>
var KEY="bodylog.v1",data=[];
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function today(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+(+p[0]+543)}
var $=function(i){return document.getElementById(i)};
function chart(el,key,color){
 var pts=data.filter(function(x){return x[key]!=null}).sort(function(a,b){return a.d<b.d?-1:1});
 if(pts.length<2){el.innerHTML='<div class="empty">ต้องมีอย่างน้อย 2 รายการ</div>';return}
 var W=320,H=130,P=26,vs=pts.map(function(x){return x[key]}),mn=Math.min.apply(0,vs),mx=Math.max.apply(0,vs);
 if(mn==mx){mn-=1;mx+=1}
 var xs=function(i){return P+i*(W-P-8)/(pts.length-1)},ys=function(v){return H-18-(v-mn)*(H-30)/(mx-mn)};
 var path=pts.map(function(x,i){return(i?"L":"M")+xs(i).toFixed(1)+" "+ys(x[key]).toFixed(1)}).join(" ");
 var dots=pts.map(function(x,i){return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(x[key]).toFixed(1)+'" r="3" fill="'+color+'"/>'}).join("");
 var f=function(v){return v.toFixed(1)};
 el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'"><text x="0" y="12" font-size="10" fill="currentColor" opacity=".6">'+f(mx)+'</text><text x="0" y="'+(H-18)+'" font-size="10" fill="currentColor" opacity=".6">'+f(mn)+'</text><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'<text x="'+P+'" y="'+(H-3)+'" font-size="10" fill="currentColor" opacity=".6">'+fmt(pts[0].d)+'</text><text x="'+(W-8)+'" y="'+(H-3)+'" font-size="10" text-anchor="end" fill="currentColor" opacity=".6">'+fmt(pts[pts.length-1].d)+'</text></svg>';
}
function render(){
 var s=data.slice().sort(function(a,b){return a.d<b.d?1:-1});
 $("list").innerHTML=s.length?s.map(function(x){
  return '<div class="item"><div><b>'+fmt(x.d)+'</b><br><small>น้ำหนัก '+(x.w!=null?x.w+" กก.":"-")+' · เอว '+(x.c!=null?x.c+" ซม.":"-")+'</small></div><button class="del" data-i="'+x.id+'" aria-label="ลบ">×</button></div>'}).join(""):'<div class="empty">ยังไม่มีข้อมูล</div>';
 var cs=getComputedStyle(document.documentElement);
 chart($("c1"),"w",cs.getPropertyValue("--a").trim());
 chart($("c2"),"c",cs.getPropertyValue("--b").trim());
}
$("d").value=today();
$("save").onclick=function(){
 var d=$("d").value,w=parseFloat($("w").value),c=parseFloat($("c").value);
 if(!d||(isNaN(w)&&isNaN(c))){alert("กรุณากรอกวันที่ และน้ำหนักหรือรอบเอวอย่างน้อย 1 ค่า");return}
 data=data.filter(function(x){return x.d!==d});
 data.push({id:Date.now(),d:d,w:isNaN(w)?null:w,c:isNaN(c)?null:c});
 store();$("w").value="";$("c").value="";render();
};
$("list").onclick=function(e){var i=e.target.getAttribute("data-i");if(i&&confirm("ลบรายการนี้?")){data=data.filter(function(x){return String(x.id)!==i});store();render()}};
$("exp").onclick=function(){var t=JSON.stringify(data);
 try{navigator.clipboard.writeText(t).then(function(){alert("คัดลอกแล้ว นำไปวางเก็บในโน้ตได้เลย")},function(){prompt("คัดลอกข้อความนี้",t)})}catch(e){prompt("คัดลอกข้อความนี้",t)}};
$("imp").onclick=function(){var t=prompt("วางข้อมูลที่สำรองไว้");if(!t)return;
 try{var a=JSON.parse(t);if(!Array.isArray(a))throw 0;data=a;store();render();alert("นำเข้าสำเร็จ")}catch(e){alert("ข้อมูลไม่ถูกต้อง")}};
load();render();
</script>
</body>
</html>
